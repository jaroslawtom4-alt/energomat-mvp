<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Logowanie - Energomat</title><link rel="stylesheet" href="/style.css"/></head>
<body>
<nav class="nav"><a class="brand" href="/">EM <span>Energomat</span></a><div><a href="/register.html">Rejestracja</a></div></nav>
<main class="auth">
  <section class="card">
    <h1>Logowanie</h1>
    <form id="loginForm" class="grid">
      <input name="email" type="email" placeholder="Email" required />
      <input name="password" type="password" placeholder="Hasło" required />
      <button class="btn" type="submit">Zaloguj</button>
    </form>
    <p id="status"></p>
    <p>Admin domyślnie: ustawiony w pliku .env</p>
  </section>
</main>
<script src="/app.js"></script>
</body></html>
